name: Release Overlay

# Push a tag like v0.1.0 to build and publish a GitHub Release with the
# Windows NSIS installer (.exe), a portable ZIP, and the auto-updater
# manifest (latest.json). Can also be triggered manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --filter="overlay..."

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/overlay
          tagName: ${{ github.ref_name }}
          releaseName: "AION Timetable Overlay ${{ github.ref_name }}"
          releaseBody: "See the commit history for what changed since the last release."
          releaseDraft: false
          prerelease: false
